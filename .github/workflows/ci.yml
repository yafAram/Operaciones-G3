name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "security/**"
      - "docs/**"
      - "test/**"
      - "chore/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Restore, build and test (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Detect test project
        id: tests
        shell: bash
        run: |
          if [ -f "tests/G3Operaciones.Tests/G3Operaciones.Tests.csproj" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore dependencies
        run: |
          if [ "${{ steps.tests.outputs.available }}" = "true" ]; then
            dotnet restore tests/G3Operaciones.Tests/G3Operaciones.Tests.csproj
          else
            dotnet restore API.G3Operaciones.Garcias.MX/API.G3Operaciones.Garcias.MX.csproj
          fi

      - name: Build API and test project
        run: |
          if [ "${{ steps.tests.outputs.available }}" = "true" ]; then
            dotnet build tests/G3Operaciones.Tests/G3Operaciones.Tests.csproj --configuration Release --no-restore
          else
            dotnet build API.G3Operaciones.Garcias.MX/API.G3Operaciones.Garcias.MX.csproj --configuration Release --no-restore
          fi

      - name: Run automated tests
        if: steps.tests.outputs.available == 'true'
        run: dotnet test tests/G3Operaciones.Tests/G3Operaciones.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Report missing test project
        if: steps.tests.outputs.available != 'true'
        run: echo "::warning::No test project exists on this ref; build was validated but automated tests were not executed."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn
