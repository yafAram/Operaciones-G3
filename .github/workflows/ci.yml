name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "security/**"
      - "docs/**"
      - "test/**"
      - "chore/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Restore, build and test (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore tests/G3Operaciones.Tests/G3Operaciones.Tests.csproj

      - name: Build API and test project
        run: dotnet build tests/G3Operaciones.Tests/G3Operaciones.Tests.csproj --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test tests/G3Operaciones.Tests/G3Operaciones.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn
